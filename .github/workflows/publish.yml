name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write     # OIDC — this is what replaces a stored npm token

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm test
      # The tag and the manifest must agree, or three sites get told to upgrade to a version
      # that does not contain what the tag says it does.
      - name: The tag matches the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
      - run: npm publish
