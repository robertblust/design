name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job id — `test` — is the status-check context a branch ruleset would require, not the
  # workflow name. If this repository ever gets a protect-main ruleset, it names `test`; rename
  # the job afterwards and the branch looks protected while nothing ever reports again. The
  # three sites hit exactly this and settled on the job id `verify`; this one differs because
  # it runs unit tests rather than a rendered-page suite, and that is the only reason.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # This package has no dependencies, and having none is a property worth keeping: three
      # sites install it, and every transitive dependency it took would land in all three. Its
      # one devDependency, Playwright, loads the link checker's fixture site in a real browser,
      # and never reaches a site, because npm installs a dependency's dependencies and not its
      # devDependencies.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The sync tool still does what it says
        run: npm test
